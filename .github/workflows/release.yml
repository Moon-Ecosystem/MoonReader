name: Build and Release

on:
  push:
    branches: [main]
    # A version tag (v0.1, v0.2, …) publishes a public "Moon Reader <version>" release
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The repo has no gradlew script, so pin the version from gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Install Android platform 36.1
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" > /dev/null

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      # Release signing reads KEYSTORE_PATH / STORE_PASSWORD / KEY_PASSWORD (key alias "upload")
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (base64 of the upload keystore)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      # Version tag: "Moon Reader 0.1" as the latest release; main push: a numbered pre-release build
      - name: Name the release
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Moon Reader $version" >> "$GITHUB_OUTPUT"
            echo "apk=MoonReader-$version.apk" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=Moon Reader build $GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "apk=MoonReader-$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.meta.outputs.apk }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
